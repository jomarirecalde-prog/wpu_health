name: Deploy to Hostinger

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-hostinger
  cancel-in-progress: true

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements-deploy.txt

      - name: Install deploy dependencies
        run: pip install -r scripts/requirements-deploy.txt

      - name: Build Hostinger deploy zip
        run: python scripts/_hostinger_zip.py

      - name: Deploy to Hostinger over SSH
        env:
          HOSTINGER_SSH_HOST: ${{ secrets.HOSTINGER_SSH_HOST }}
          HOSTINGER_SSH_PORT: ${{ secrets.HOSTINGER_SSH_PORT }}
          HOSTINGER_SSH_USER: ${{ secrets.HOSTINGER_SSH_USER }}
          HOSTINGER_SSH_PASSWORD: ${{ secrets.HOSTINGER_SSH_PASSWORD }}
          HOSTINGER_REMOTE_ROOT: ${{ secrets.HOSTINGER_REMOTE_ROOT }}
          HOSTINGER_REMOTE_ZIP: ${{ secrets.HOSTINGER_REMOTE_ZIP }}
          HOSTINGER_APP_URL: ${{ secrets.HOSTINGER_APP_URL }}
          HOSTINGER_DB_NAME: ${{ secrets.HOSTINGER_DB_NAME }}
          HOSTINGER_DB_USER: ${{ secrets.HOSTINGER_DB_USER }}
          HOSTINGER_DB_PASSWORD: ${{ secrets.HOSTINGER_DB_PASSWORD }}
        run: python scripts/hostinger_deploy.py
